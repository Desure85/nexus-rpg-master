name: Demo (GitHub Pages)

# Демо целиком в браузере: сервер игры работает во вкладке (sql.js + IndexedDB), ИИ — заготовки.
# Публикуется в ветку gh-pages (Pages → Deploy from branch: gh-pages / root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:demo
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/
      - name: Publish to gh-pages
        run: |
          cd dist-demo
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Demo build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
