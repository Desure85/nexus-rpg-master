name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test production build
        env:
          LLM_PROVIDER: mock
          MOCK_LLM_DELAY_MS: "0"
          DB_PATH: /tmp/ci.db
          PORT: "3100"
        run: |
          npm start &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:3100/ | grep -q '<div id="root">'

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nexus-rpg:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
