name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test production build
        env:
          LLM_PROVIDER: mock
          MOCK_LLM_DELAY_MS: "0"
          DB_PATH: /tmp/ci.db
          PORT: "3100"
        run: |
          npm start &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:3100/ | grep -q '<div id="root">'

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nexus-rpg:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mobile:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: npm run build
      - name: Mobile layout audit (390px and 360px)
        env:
          LLM_PROVIDER: mock
          MOCK_LLM_DELAY_MS: "0"
          DB_PATH: /tmp/mobile.db
          PORT: "3100"
          COOKIE_SECURE: "false"
          FREE_CREDITS: "100000"
        run: |
          npm start &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/api/health && break; sleep 1; done
          BASE_URL=http://127.0.0.1:3100 OUT_DIR=mobile-report node e2e/mobile.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screens
          path: mobile-report
